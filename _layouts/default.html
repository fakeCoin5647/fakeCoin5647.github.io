<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% include head.html %}
</head>
<body>
  {% include icon-sprite.html %}

  <a class="skip-link" href="#mainContent">跳到主要内容</a>

  <div class="page">
    {% include sidebar.html %}

    <main class="content" id="mainContent">
{{ content }}
      {% include site-footer.html %}
    </main>
  </div>

  <button type="button" class="comment-fab" id="commentFab" aria-haspopup="dialog" aria-controls="commentDialog" aria-label="为当前页面添加评论">
    <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
    <span class="comment-fab-label">评论</span>
    <span class="comment-fab-count" id="commentFabCount" hidden>0</span>
  </button>

  {% include templates.html %}
  {% include dialogs.html %}

  <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
      <filter id="lg-refract" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="8" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="1.2" result="ripple"/>
        <feDisplacementMap in="SourceGraphic" in2="ripple" scale="12" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <script src="assets/js/app.js"></script>
</body>
</html>
