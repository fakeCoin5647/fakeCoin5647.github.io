*{box-sizing:border-box}body{margin:0;color:#213439;background:#f5f7f7;font:1.1rem/1.85 system-ui,sans-serif}header,main{max-width:76rem;margin:auto;padding:1rem clamp(1rem,4vw,3.5rem)}header{display:flex;align-items:center;gap:1em;flex-wrap:wrap;border-bottom:1px solid #c3d3d0}a,button,summary{color:#105f58}button,select,textarea{font:inherit}button,select,.act{min-height:44px;padding:.4em .8em;border:1px solid #afc6be;border-radius:.55em;background:white;color:#174d47;cursor:pointer}a{overflow-wrap:anywhere}h1,h2,h3{line-height:1.35}h1{font:600 clamp(2rem,5vw,3.2rem)/1.25 Georgia,serif}main{display:grid;grid-template-columns:minmax(11rem,16rem) minmax(0,44rem);gap:2.3rem}aside a{display:block;padding:.6em;border-bottom:1px solid #d3dfdd;text-decoration:none}aside a[aria-current]{font-weight:bold;background:#e1eeea}article{background:white;padding:clamp(1rem,3.6vw,2.5rem);border-radius:1em;margin:1rem 0}article p{white-space:pre-line;overflow-wrap:anywhere}small{color:#4f6663}summary{cursor:pointer;padding:.6em 0}textarea{width:100%;min-height:5em;border:1px solid #9cb5af;border-radius:.5em;padding:.7em}nav{display:flex;flex-wrap:wrap;gap:.5em}#status{min-height:1.5em}button:focus-visible,a:focus-visible{outline:3px solid #bf6a19}@media(max-width:850px){main{display:block}aside{display:flex;overflow-x:auto;gap:.35rem}aside a{white-space:nowrap}header{gap:.5em}article{margin:.8rem 0}}@media print{header,aside,nav,button,details,#status{display:none}main{display:block}article{break-inside:avoid}}
</style><header><a href="../../#/courses">返回论文书架</a><strong>Coin 的创作小屋</strong></header><main><div><h2>阅读顺序</h2><aside id="papers"></aside></div><section><h1 id="title"></h1><p>每一步都附有原文页码。可以在讲解下记笔记，也可以打开原文，把推导直接写在对应页上。</p><details><summary>本机笔记与备份</summary><p>精读文字笔记保存在当前浏览器。换设备可导出再导入，同一步已有的不同笔记会合并。原文手写批注请在论文书架单独导出。</p><button id="save">导出精读笔记</button> <label class="act">导入精读笔记<input id="load" type="file" accept=".json" style="max-width:100%"></label></details><p id="status" role="status"></p><details><summary>本篇步骤目录</summary><div id="toc"></div></details><div id="steps"></div></section></main><script id="content" type="application/json">[{"id": "paged", "title": "PagedAttention · 从注意力到显存分块", "steps": [{"page": 3, "title": "注意力如何利用过去的信息", "body": "词元是分词后得到的编号，一个词可能对应多个编号。模型把编号转换为向量。当前位置产生查询 q，过去各位置保存键 kᵢ 和值 vᵢ。查询与键的点积除以 √d 得到分数（d 是键向量维度）；取指数并除以指数总和得到权重，它们的和为 1。用这些权重对值求和。若两个分数相等，两个值为 2 和 6，结果是 4。"}, {"page": 3, "title": "从逐词生成推导缓存大小", "body": "未来的查询会变化，已有位置的键和值可以重复使用。把它们保存在显存就能省下重新计算。设每层每词元的键、值各有 h 个头，每头 d 个数，每数 s 字节，模型有 L 层。若每层形状相同，缓存 n 个位置共需 2Lnhds 字节。因子 2 来自 K、V 两份。权重、临时张量和分配器开销需要另外计算。"}, {"page": 4, "title": "为什么有空闲格子仍放不下", "body": "图 3 区分多种浪费。给一个请求连续预留 16 格，目前用 5 格，最终用 9 格。现在空出的 11 格中，有 4 格将来会用，另 7 格直到结束都空着。外部碎片则是另一种情况：两段连续空区分别有 3 格和 4 格，即便合计 7 格，也装不下必须连续放置的 6 格。"}, {"page": 5, "title": "从整数约束推出分块公式", "body": "一块容量为 B，缓存 n 个位置需要的块数，是所有满足 kB≥n 的非负整数 k 中最小的，故 k=⌈n/B⌉。这一序列独占的空位数为 kB−n，在 0 至 B−1 之间。B=4、n=9 时需要 3 块，空 3 格。十个请求各有独立末块时，这些空位可以累加。"}, {"page": 6, "title": "手算逻辑位置到物理地址", "body": "位置从 0 编号。B=4 时，位置 i 的逻辑块号为 ⌊i/4⌋，块内偏移为 i 除以 4 的余数。块表若为 [7,2,9]，位置 6 在逻辑块 1，对应物理块 2 的偏移 2。位置 8 则在物理块 9 的偏移 0。参照图 6，解释为何物理地址不连续时仍可按逻辑顺序访问历史。"}, {"page": 7, "title": "共享前缀为何需要写时复制", "body": "读图 8。两个候选共享提示，已填满的块能被两张块表同时引用。若最后一块还有空位，两条分支要写入不同的内容，就不能让两者都修改共享块。写时复制先给写者独立副本。两条序列共同引用整块时，第一条结束仅把引用计数从 2 减到 1；第二条仍需读取，计数归零时才可回收。"}, {"page": 8, "title": "暂停的代价怎样估算", "body": "容量不足可暂停部分序列。换出缓存再搬回来占用链路，仅保留词元并重建缓存则占计算资源。若传 S 字节、带宽 W 字节/秒，在两个方向带宽相同的理想条件下来回传输至少耗时 2S/W。与重建时间 R 比较时应说明忽略了排队、传输启动和计算重叠。第 13 页图 19 可对照两种方法的实际开销。"}, {"page": 11, "title": "从实验读出有条件的结论", "body": "结合第 10 页图 12、13 与 §6.2。在 ShareGPT 单样本生成实验中，相近延迟下，vLLM 相对 Orca (Oracle) 可承受 1.7 至 2.7 倍的请求率。横轴是请求/秒，图 12 的纵轴是归一化延迟（秒/词元）。机制是容纳更多并发请求并提高批处理利用率；这个比值不能直接预测单个空载请求的加速比。"}]}, {"id": "dist", "title": "DistServe · 分开预填充与解码", "steps": [{"page": 4, "title": "用一条时间线定义延迟", "body": "请求 0 秒到达，首个词元在 0.4 秒返回，其余两个词元在 0.5、0.7 秒返回。首词元时间 TTFT 是 0.4 秒；首词元之后的平均间隔 TPOT 为 (0.7−0.4)/(3−1)=0.15 秒/词元。单独一个间隔可能达到 0.2 秒。如果只输出一个词元，后续间隔的平均值无定义。"}, {"page": 4, "title": "拆开预填充与解码", "body": "预填充一次处理整个输入提示，在各层留下缓存并给出第一个输出。解码迭代利用缓存生成后续词元。一个序列的下一步依赖上一步实际选出的词元；不同请求可以共同组批。练习：输入长 1000、输出长 3 时，预填充处理 1000 个输入位置，首个输出之后还需两步解码。"}, {"page": 5, "title": "把算力和显存带宽换算成时间", "body": "某一步需要 F 次运算，搬运 D 字节。在峰值算力 P（次/秒）、带宽 W（字节/秒）下，耗时至少为 max(F/P,D/W)。这是下界，额外通信、排队与执行开销可能使时间更长。长提示预填充可以并行处理许多位置，小批解码则可能受读取权重和缓存的带宽限制。图 2 展示两阶段混合后单步时间的变化。"}, {"page": 10, "title": "给每个请求分别判定两项目标", "body": "第 10 页表 1：OPT-13B 聊天负载的首词元目标为 0.25 秒，后续每词元目标为 0.1 秒。要同时检查两项。若 100 条中分别有 95、92 条满足单项目标，两项同时满足的有 87 至 92 条（下界是 95+92−100）。因此单凭两个达标数不能确定是否有 90% 请求同时达标。"}, {"page": 3, "title": "用瓶颈计算理解为何拆分", "body": "同卡混跑时，长提示可能拖长已有请求两次输出之间的等待；先顾解码，新请求首词元又会推迟。教学计算：每张卡可处理每秒 5 个预填充或 10 个请求的解码，给前者两卡、后者一卡，理想流水线容量最多 min(2×5,1×10)=10 请求/秒，每卡约 3.33。假设请求工作量稳定、负载均分且链路足够快。"}, {"page": 7, "title": "计算缓存交接的最低代价", "body": "解码卡必须取得预填充阶段的 KV 缓存。若传 0.5 GB，给该请求独占的持续带宽为 25 GB/s，单次传输至少需要 0.02 秒。十条请求共享一条链路时，每条都按独占带宽估算会低估排队。回到 §3.3 和 §4，找出跨节点带宽较低时为何需要改变放置方案。"}, {"page": 8, "title": "沿一次配置搜索理解方法", "body": "对固定的模型、设备与工作负载，先列候选的阶段资源数和并行方式，再用性能估计与模拟判断哪个候选支持更高的每卡达标请求率。张量并行把层内运算分给多卡，流水线并行把不同层分成阶段。给某阶段增加卡数可能缩短计算，也可能增加通信；不能单按模型参数量推断最优配置。"}, {"page": 11, "title": "沿图 8 的纵轴检查实验", "body": "在 ShareGPT 聊天实验中，提高横轴的每卡请求率，观察满足延迟目标的请求比例。在同一模型下，沿 90% 附近寻找可承受的最大请求率，再比较系统。作者报告 DistServe 相对 vLLM 可承受 2.0 至 4.6 倍请求率，范围来自不同模型配置。若改做摘要任务，应重新看第 10 页表 1 和图 7 的目标、长度分布，并到第 12 页图 9 检查对照实验。"}]}, {"id": "gavel", "title": "Gavel：把设备差异写进调度模型", "steps": [{"body": "训练任务反复用一批数据计算并更新参数，每次更新算一次迭代。12 秒完成 60 次的速度为 60÷12＝5 次/秒；若还剩 100 次且速度不变，需连续运行 20 秒。这个答案没有包含排队。计算从提交到结束的时间时，还需加入任务等待的墙钟时间。", "page": 4, "title": "训练迭代与吞吐量"}, {"body": "论文把不同任务放在行、不同设备类型放在列。三行在 V100、K80 上的速度分别为 (40,10)、(12,4)、(100,50)，单位为次/秒。逐行相除得到换卡的速度倍率 4、3、2。因此两种设备之间没有对所有任务通用的加速倍数；不同任务的一次迭代也可能代表不同的计算量。", "page": 7, "title": "逐行读设备性能矩阵"}, {"body": "令 Tᵢⱼ 为任务 i 在 j 型卡上的速度，Xᵢⱼ 为它在观察窗口内使用 j 型卡的时间比例。窗口长度 H 秒，则在该设备上运行 HXᵢⱼ 秒、完成约 HXᵢⱼTᵢⱼ 次迭代。对设备求和并除以 H，得到 vᵢ＝ΣⱼXᵢⱼTᵢⱼ。例：快慢卡速度为 40、10，60 秒内各用 15、30 秒，其余时间等待；总迭代数 900，有效吞吐量为 15 次/秒。", "page": 5, "title": "从累计进度推出有效吞吐量"}, {"body": "先假定每个任务只用一张卡，每张卡同时只容纳一个任务。Xᵢⱼ≥0。同一任务在所有卡上的时间占比相加至多为 1；同型卡上全部任务的占比相加至多为该型卡数。两条约束分别按行与按列求和。如果任务 i 需要 sᵢ 张同型卡一起运行，占用的卡秒也乘以 sᵢ。若同卡同时运行多个任务，实际速度可能受干扰，原文将任务组合单独计量。", "page": 5, "title": "检验一个分配是否可行"}, {"body": "三项任务平分每张卡，各得其 1/3 时间。根据矩阵，参考速度为 50/3、16/3、150/3。将每个任务的实际速度除以自己的参考速度，可得无量纲的相对进度。等权单卡情形希望最慢的相对进度尽量大。用 z 代表共同下界，逐项要求 vᵢ≥z·参考速度ᵢ，并最大化 z。由于参考速度给定，所有这些约束对变量都是线性的。", "page": 7, "title": "写出公平目标"}, {"body": "原文给出的三行份额为 (0.45,0)、(0.45,0.09)、(0.09,0.91)。逐项相乘并相加，速度为 18、5.76、54.5，再除以各自的参考速度得约 1.08、1.08、1.09。论文把改进概括作约 10%；分配矩阵只显示两位小数。自测：交换第二行的两个数，检查行列约束。结果慢卡列和为 1.36，超过一张卡，即使各任务的行和仍满足上限也无法执行。", "page": 7, "title": "复核论文的近似解"}, {"body": "若固定分配下任务 i 还需做 Rᵢ 次迭代，速度为 vᵢ>0，则需时 Rᵢ/vᵢ。最后一个任务的结束时间是这些比值的最大值。给定候选时间 h>0，所有任务均按时完成等价于对每个 i 要求 hvᵢ≥Rᵢ。例：两个任务还需 100、30 次，速度均为 10，完工时间是 10 秒。把第二项速度翻倍，最后完工时间仍为 10 秒。", "page": 7, "title": "全体任务何时完成"}, {"body": "真实的卡在一轮内只能执行具体任务。Gavel 根据任务在各类设备上已得到的时间，比较目标份额与已获份额，优先补足服务不足的组合。举例：两任务在同一设备上的目标均为 1/2，历史份额为 1/4 和 3/4，优先级比值分别为 2 和 2/3，因此前者更急。这是历史份额非零的简化演算；多卡任务或允许同卡并发时，还需要额外检查物理设备能否同时容纳选择的任务。", "page": 9, "title": "把长期份额变为排班"}, {"body": "作者在较大模拟集群中比较 LAS 与异构感知方案。在连续单工作器轨迹的高到达率 5.6 个任务/小时处，报告平均任务完成时间改善 3.5 倍；多工作器轨迹在 2.6 个任务/小时时报告 2.2 倍。倍数按基线时间除以改进后的时间理解。复述实验时须同时给出指标、工作负载、到达率、基线及模拟环境，才能知道这个数字回答什么问题。", "page": 12, "title": "阅读实验曲线与适用范围"}, {"body": "练习：A 设备计算一个请求需 4 秒，还需 5 秒加载权重；B 设备需 6 秒，且已加载。若无排队、加载与计算串行，结束时间分别为 9、6 秒。B 更早完成。此例说明训练吞吐量表可以启发设备选择，但用于推理还要描述模型是否就绪、请求所处阶段和缓存可用性。这些数字是教学假设。检验：若 A 可与别的计算重叠加载，其中哪些时间还应该相加？", "page": 6, "title": "把训练模型用于推理时少了什么"}]}, {"steps": [{"page": 1, "title": "从一台服务器开始", "body": "任务在 A 时刻到达，D 时刻完成，响应时间是 D−A，包括等待。M/G/1 中 M 指泊松到达，G 允许一般服务时长分布，1 是一台服务器。教学例：两个任务同时到达，耗时 1 和 5。若短者先做，平均响应时间是 (1+6)/2=3.5；长者先做则是 5.5。这个例子还假设时长已知。"}, {"page": 4, "title": "服务进度带来什么信息", "body": "一个任务等待 10 分钟，只运行 2 分钟，其已获服务量为 2。若总时长记作 S，已服务 a 仍未完成恰说明 S>a。令 F 为 S 的分布函数。只要 F(a)\u003c1，下一段 h 内完成的条件概率是 [F(a+h)−F(a)]/[1−F(a)]。在数轴上画出条件事件和交集，解释分子为何要减 F(a)。"}, {"page": 5, "title": "状态和可观察信息", "body": "每个任务的状态 x 汇总可用信息。马尔可夫性指给定当前状态和接下来的服务，未来状态的条件分布已确定。调度器知道转移规律和当前状态，任务真实剩余时间却可能仍未知。某些状态允许中断，另一些必须运行到允许切换为止。"}, {"page": 5, "title": "为什么可以比较持有成本", "body": "若每个在场任务每单位时间产生 1 单位成本，系统瞬时成本 H 就是当前人数 N。把 N(t) 曲线下面积按任务重排，每个任务贡献自己在观察窗内停留的时长。稳定状态下 Little 定律给出 E[N]=λE[D−A]。给定请求到达率 λ，最小化平均人数等价于最小化平均响应时间。一般模型允许不同状态有不同成本率。"}, {"page": 6, "title": "建立一次限时试运行", "body": "考虑只知道已服务量 a、单位持有成本的情形。最多继续服务 h 个时间单位，若提前完成则立刻停止。完成收益的期望为 P(S−a≤h "}, {"page": 6, "title": "算出一次排序反转", "body": "教学例：S 等概率取 1 或 9。新任务若选 h\u003c1，收益为零；1≤h\u003c9 时比值为 (1/2)/[(1+h)/2]=1/(1+h)；h≥9 时为 1/5。最大值 1/2 在 h=1 取得。服务满 1 仍未完成时，剩余必为 8，指数更新为 1/8。与确定剩余 3 单位、指数为 1/3 的任务相比，排序此刻反转。"}, {"page": 6, "title": "定理 V.1 的条件与结论", "body": "作者在批泊松到达、单服务器、任务按服务进度发生马尔可夫状态转移的模型中证明 Gittins 最小化稳态平均持有成本。可用策略遵守同样的可见信息与抢占限制，并满足文中稳态和正则条件。每个任务成本为 1 即得到平均响应时间结论。GPU 同步组批与多设备并行都改变了服务模型。"}, {"page": 7, "title": "证明先解单任务停止问题", "body": "设可以付出服务时间继续运行，也可以在允许的状态停止，支付与该状态成本率和参数 r 成比例的处罚。对于固定 r，可以求出应当停止的状态集合。随着 r 变化会得到一族集合，连接单任务决策和优先级。这里停止的是用于计算的单任务游戏，在真实队列中暂停的任务仍要完成。"}, {"page": 8, "title": "从平均成本转成工作量", "body": "将 H 分成可抢占与不可抢占两部分。不可抢占状态意味着正在服务，因此这部分的期望成本不随调度而变（引理 VII.2）。对每个 r，定义 r-work 为相关任务至完成或进入最优停止集所需的工作。定理 VII.5 用平均 r-work 的正权积分表达平均可抢占成本，所以同时最小化每个 r 的期望工作量就足够。"}, {"page": 9, "title": "检查证明的最后一环", "body": "Gittins 总是先处理相关任务，有 r-work 时便以全速减少它。已有任务也会从不相关变成相关，所以只看消耗速度仍不够。证明进一步利用这类重新进入在 Gittins 下只发生于现有 r-work 为零时，得到定理 VII.7。自测：写出 VII.2、VII.5、VII.7 各自连接的两个量，并解释哪个环节需要考虑重新进入。"}], "title": "Gittins 调度与平均响应时间", "id": "gittins"}, {"steps": [{"page": 7, "title": "用一个请求认识阶段", "body": "prefill 一次处理输入并建立缓存，此后每次 decode 迭代为每个入选请求生成一个词元。设输入长 l、输出长 l′，模型用 s=0 表示预填充，直至 s=l′。例如 l=2、l′=2 时，各阶段的缓存权重是 2、3、4。它们的和衡量遍历各阶段的总权重；单请求峰值是 4。"}, {"page": 8, "title": "批次耗时的数学模型", "body": "式 (1) 给出校准近似 τ(B)=d₀+d₁∑(lᵢ+sᵢ)。教学例取 d₀=2 毫秒、d₁=0.1 毫秒/词元。两个解码请求分别含 3、7 份缓存，合批耗时 3 毫秒，各自单跑合计 5 毫秒。固定开销被分摊，但小请求所在迭代耗时变长。图 3 给出了拟合所用具体 GPU 与模型设置。"}, {"page": 10, "title": "重算原文例 1", "body": "容量 12，预填充权重 1、解码权重 2。三个旧请求正在解码，再接六个预填充，当前合计 3×2+6×1=12。旧请求结束后，六个新请求进入解码便占满 12。若同时还想接四个预填充，就缺四单位。论文中被驱逐者丢失缓存、重新排队。自测：四个预填充配四个解码为何能稳定接续？"}, {"page": 12, "title": "从整数队列到流体基准", "body": "把整数任务数先放宽为连续数量，寻找各阶段流入与流出相等的平衡。单类型若每个阶段每轮处理 n 个，流水线填满后每轮完成 n 个。各阶段缓存加总 M=n∑ₛ(l+s)=n(l′+1)(l+l′/2)，用到从 0 至 L 的整数和 L(L+1)/2。这个基准用来比较性能；实际系统还必须取整数，且各队列未必有足够请求。"}, {"page": 16, "title": "已知长度时的 WAIT", "body": "给每种类型 j 配正整数阈值 nⱼ。该类型入口至少有 nⱼ 个等待者时，从其每个阶段分别选至多 nⱼ 个；入口不足则该类型整轮等待。例：阈值为 2，阶段队列有 3、1、4 个，选数为 2、1、2，每个入选请求只推进一阶段。若入口改为 1，选数全为零。已到 GPU 的等待者仍占缓存。"}, {"page": 18, "title": "定理 4 中两个约束", "body": "将各类的阶段缓存相加得 Mπ，一轮时间上界 ΔT=d₀+d₁Mπ。平均到达率 λⱼ 乘 ΔT 给出这一轮期望流入，式 (11) 要求它不超过 nⱼ，另要求 M*≤Mπ≤C。空系统起步，符合条件时吞吐基准差为 O((ζT)⁻¹ᐟ²)，各正流量类型均有严格余量时提升为 O((ζT)⁻¹)。量级给出随尺度变化的界，无法直接指定单请求截止时间。"}, {"page": 20, "title": "未知输出长度怎样揭晓", "body": "主算法假设输入长度相同，可能输出长度 l′₁\u003c⋯\u003cl′ₘ。教学例：长度 2 的概率为 3/4，长度 5 为 1/4。新请求进入时无法知道所属类型，过了第一边界仍继续则必属于长类。这些幸存请求即使在下一段入口等待也保留 GPU 缓存；外部尚未预填充的请求仍不占缓存。计算总显存必须区分两个等待位置。"}, {"page": 23, "title": "逐行执行算法 2", "body": "先更新到达和上轮完成，结束者释放缓存，幸存者进入下段边界队列。然后从第一段开始找入口全达标的最长连续前缀。两段阈值为 4、2，入口人数为 5、1 时只选第一段；入口为 5、2 时两段都可入选。发射前按保守的下一轮状态查显存，必要时从未选中的驻留边界请求中后进先出地驱逐。未选的内部任务保留缓存。"}, {"page": 24, "title": "严格阅读定理 7", "body": "固定原始到达率、长度集合、阈值和严格余量，从空系统出发。输出长度独立同分布，策略不偷看未来，保留的下游段满足 0\u003cpₖ\u003cnₖ/nₖ₋₁\u003c1，pₖ 是继续进入该段的条件概率。另需式 (12) 的负载条件、Mπ≥M*、式 (14) 的物理容量以及 δ 的限制。此时期望吞吐基准差为 O(1/(ζT))，平均时延和首词元时间的期望为 O(1)，时域内发生溢出驱逐的概率至多 δ。容量条件随时域和 δ 而变。"}, {"page": 24, "title": "证明为何需要对数缓冲", "body": "假设上段每阶段取 4 个，继续概率 1/4，平均送往下游 1 个。下段阈值 2 高于平均流入，但偶尔 4 个都继续。证明分析边界队列的指数尾部，再同时控制多个时刻和边界。教学推演：若一次越界概率形如 exp(−θb)，N 次中的任一次越界概率至多 N exp(−θb)。令此量≤δ，解得 b≥log(N/δ)/θ。这解释式 (14) 对数项的来源，完整 θₖ 和每个缓存权重见原式。"}, {"page": 29, "title": "怎样审读实证", "body": "实验分合成负载和 lmsys-chat-1m 轨迹。读一幅图时先记录横轴负载、容量设置、比较策略与纵轴单位，再比较吞吐、时延和驱逐是否同向变化。自测：一个策略平均吞吐最高，能否推出每个请求获得首词元的时间都最短？不能，系统速率和每件工作的等待时间是不同随机量。"}], "title": "Nested WAIT 与未知长度下的显存约束", "id": "wait"}]</script><script>
const lessons=JSON.parse(document.querySelector('#content').textContent),$=id=>document.getElementById(id);
const prefix='coin.paperNotes.v1.', keys=new Set(lessons.flatMap(l=>l.steps.map((s,i)=>l.id+'-'+(i+1))));
function say(s){$('status').textContent=s}
function el(tag,txt){const e=document.createElement(tag);e.textContent=txt;return e}
function link(txt,href){const a=el('a',txt);a.href=href;return a}
function render(){
const [id,step]=location.hash.slice(1).split('/');const l=lessons.find(x=>x.id===id)||lessons[0];$('papers').replaceChildren();$('steps').replaceChildren();$('toc').replaceChildren();$('title').textContent=l.title;
for(const x of lessons){const a=link(x.title.split('：')[0],'#'+x.id);if(x===l)a.setAttribute('aria-current','page');$('papers').append(a)}
l.steps.forEach((s,i)=>{const n=i+1,k=l.id+'-'+n,a=el('article','');a.id=k;const jump='#'+l.id+'/'+n;$('toc').append(link(n+'. '+s.title,jump),el('br',''));a.append(el('small','第 '+n+' 步 / 共 '+l.steps.length+' 步'),el('h2',s.title),el('p',s.body));const nav=el('nav',''),pdf=link('原文第 '+s.page+' 页 · 手写批注','../../#/courses/papers/'+l.id+'/'+s.page);pdf.className='act';nav.append(pdf);a.append(nav);const d=el('details',''),sum=el('summary','写笔记或就这一步提问'),t=el('textarea','');t.placeholder='写下推导，或指出你从哪一行开始困惑…';t.setAttribute('aria-label',s.title+'的笔记或问题');try{t.value=localStorage.getItem(prefix+k)||''}catch{say('浏览器存储不可用，请复制保留笔记。')}const msg=el('small','');msg.setAttribute('role','status');t.oninput=()=>{try{localStorage.setItem(prefix+k,t.value);msg.textContent='已保存到本机'}catch{msg.textContent='保存失败，请复制保留'}};const ask=el('button','复制问题发给 ChatGPT');ask.onclick=async()=>{const context=l.title+' · 第 '+n+' 步《'+s.title+'》 · PDF 第 '+s.page+' 页\n'+s.body+'\n我的疑问：'+(t.value||'请从定义开始逐行解释，并给一个可手算的例子。');try{await navigator.clipboard.writeText(context);msg.textContent='已复制。在当前对话粘贴即可追问。'}catch{const copy=el('textarea','');copy.value=context;d.append(copy);copy.select();msg.textContent='请复制选中的提问内容。'}};const chat=link('打开 ChatGPT','https://chatgpt.com/');chat.target='_blank';chat.rel='noopener';d.append(sum,t,ask,' ',chat,el('br',''),msg);a.append(d);$('steps').append(a)});
if(step)requestAnimationFrame(()=>$(l.id+'-'+step)?.scrollIntoView());else window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
$('save').onclick=()=>{try{const notes={};for(const k of keys){const v=localStorage.getItem(prefix+k);if(v)notes[k]=v}const url=URL.createObjectURL(new Blob([JSON.stringify({format:'paper-notes-v1',notes},null,2)],{type:'application/json'})),a=link('',url);a.download='论文精读笔记.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch{say('导出失败，请检查浏览器存储权限。')}};
$('load').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const data=JSON.parse(await f.text());if(data.format!=='paper-notes-v1'||!data.notes||typeof data.notes!=='object')throw Error();const rows=Object.entries(data.notes);if(rows.some(([k,v])=>!keys.has(k)||typeof v!=='string'))throw Error();for(const [k,v] of rows){const old=localStorage.getItem(prefix+k)||'';if(v&&!old.includes(v))localStorage.setItem(prefix+k,old?old+'\n\n'+v:v)}render();say('精读笔记已导入。')}catch{say('导入未完成，请检查备份格式和剩余空间。')}e.target.value=''};
</script></html>
