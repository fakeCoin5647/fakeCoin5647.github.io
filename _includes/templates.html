  <template id="novelCardTemplate">
    <article class="novel-card">
      <a class="novel-card-main" href="#/">
        <span class="novel-cover-slot"></span>
        <span class="novel-card-info">
          <span class="novel-kicker">
            <span class="status-pill"><i aria-hidden="true"></i><span class="status-text"></span></span>
            <span class="novel-genre"></span>
          </span>
          <span class="novel-card-title"></span>
          <span class="novel-card-summary"></span>
          <span class="novel-card-meta"></span>
          <time class="novel-card-date"></time>
        </span>
      </a>
      <div class="card-actions novel-actions">
        <button type="button" class="icon-btn pin-btn" data-action="pin-novel" title="置顶小说" aria-label="置顶小说" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg>
        </button>
        <button type="button" class="icon-btn" data-action="edit-novel" title="编辑小说资料" aria-label="编辑小说资料">
          <svg class="icon" aria-hidden="true"><use href="#i-pencil"></use></svg>
        </button>
        <button type="button" class="icon-btn danger-hover" data-action="delete-novel" title="删除小说" aria-label="删除小说">
          <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
        </button>
      </div>
    </article>
  </template>

  <template id="outlineEditorTemplate">
    <div class="outline-editor-page">
      <a class="back-link outline-editor-back" data-outline-back href="#/">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
        <span data-outline-back-label>返回大纲列表</span>
      </a>

      <header class="outline-editor-head">
        <div class="outline-editor-heading">
          <p class="eyebrow" data-outline-eyebrow>OUTLINE · NEW</p>
          <h1 class="outline-editor-title" data-outline-heading>新增大纲</h1>
          <p class="outline-editor-desc" data-outline-desc>整页书写，分卷、章节与分场都可以一次铺开。</p>
        </div>
        <div class="outline-editor-head-actions">
          <div class="view-switch outline-status-switch" role="group" aria-label="大纲状态" data-outline-status>
            <button type="button" class="view-switch-btn" data-status-value="">未标记</button>
            <button type="button" class="view-switch-btn" data-status-value="planning">构思中</button>
            <button type="button" class="view-switch-btn" data-status-value="drafting">写作中</button>
            <button type="button" class="view-switch-btn" data-status-value="done">已完成</button>
          </div>
          <button type="button" class="btn ghost" data-outline-cancel>取消</button>
          <button type="submit" form="outlineEditorForm" class="btn primary">
            <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
            <span data-outline-save-label>保存大纲</span>
          </button>
        </div>
      </header>

      <form id="outlineEditorForm" class="outline-editor-form panel" data-comment-anchor="page" novalidate>
        <div class="field outline-title-field" id="outlineEditorTitleField">
          <label for="outlineEditorTitleInput">标题 <span class="field-mark">必填</span></label>
          <input type="text" id="outlineEditorTitleInput" name="title" class="outline-title-input" maxlength="60" autocomplete="off">
          <p class="field-error" id="outlineEditorTitleError" hidden>请先给这条大纲一个标题。</p>
        </div>

        <div class="outline-editor-meta">
          <div class="field">
            <label for="outlineEditorScopeInput">层级 / 范围 <span class="field-optional">选填</span></label>
            <input type="text" id="outlineEditorScopeInput" name="subtitle" maxlength="60" autocomplete="off">
          </div>
          <div class="field">
            <label for="outlineEditorSummaryInput">一段话梗概 <span class="field-optional">选填</span></label>
            <input type="text" id="outlineEditorSummaryInput" name="summary" maxlength="160" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <span class="field-label" id="outlineVisibilityLabel">公开范围</span>
          <div class="visibility-picker" role="radiogroup" aria-labelledby="outlineVisibilityLabel" data-outline-visibility>
            <label class="visibility-option">
              <input type="radio" name="outlineVisibility" value="inherit" checked>
              <span class="visibility-option-copy">
                <span class="visibility-option-title">跟随小说</span>
                <span class="visibility-option-desc">小说解锁时一起公开</span>
              </span>
            </label>
            <label class="visibility-option">
              <input type="radio" name="outlineVisibility" value="public">
              <span class="visibility-option-copy">
                <span class="visibility-option-title">公开</span>
                <span class="visibility-option-desc">小说解锁时可见</span>
              </span>
            </label>
            <label class="visibility-option">
              <input type="radio" name="outlineVisibility" value="private">
              <span class="visibility-option-copy">
                <span class="visibility-option-title">私密</span>
                <span class="visibility-option-desc">永不进入快照</span>
              </span>
            </label>
          </div>
          <p class="field-hint visibility-hint" data-outline-visibility-hint></p>
        </div>

        <div class="field outline-notes-field">
          <label for="outlineEditorNotesInput">大纲正文 <span class="field-optional">选填</span></label>
          <textarea id="outlineEditorNotesInput" name="notes" rows="20"></textarea>
          <div class="field-foot">
            <span class="field-hint">分场、转折、伏笔、人物变化都可以写在这里，换行会保留；[[名字]] 可链接其他词条</span>
            <span class="field-hint counter" id="outlineEditorNotesCount">0 字</span>
          </div>
        </div>

        <div class="field">
          <label for="outlineEditorTagInput">标签 <span class="field-optional">选填</span></label>
          <div class="tag-editor" id="outlineEditorTagEditor">
            <input type="text" id="outlineEditorTagInput" list="outlineEditorTagSuggestions" maxlength="16" placeholder="输入后按回车" autocomplete="off" aria-describedby="outlineEditorTagHint">
          </div>
          <datalist id="outlineEditorTagSuggestions"></datalist>
          <p class="field-hint" id="outlineEditorTagHint">最多 8 个，回车或逗号确认</p>
        </div>

        <footer class="outline-editor-footer">
          <span class="outline-editor-footer-hint">
            <span class="outline-editor-state" data-outline-state aria-live="polite">尚未保存</span>
            <span class="dialog-hint">Ctrl / ⌘ + Enter 保存</span>
          </span>
          <div class="outline-editor-footer-actions">
            <button type="button" class="btn ghost" data-outline-cancel>取消</button>
            <button type="submit" class="btn primary">
              <svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>
              <span data-outline-save-label>保存大纲</span>
            </button>
          </div>
        </footer>
      </form>
    </div>
  </template>

  <template id="entryCardTemplate">
    <article class="entry-card">
      <a class="entry-card-main" href="#/">
        <h3 class="entry-card-title"></h3>
        <p class="entry-card-subtitle"></p>
        <p class="entry-card-excerpt"></p>
        <div class="entry-card-tags"></div>
        <time class="entry-card-date"></time>
      </a>
      <div class="card-actions entry-actions">
        <button type="button" class="icon-btn pin-btn" data-action="pin-entry" title="置顶条目" aria-label="置顶条目" aria-pressed="false">
          <svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg>
        </button>
        <button type="button" class="icon-btn" data-action="edit-entry" title="编辑条目" aria-label="编辑条目">
          <svg class="icon" aria-hidden="true"><use href="#i-pencil"></use></svg>
        </button>
        <button type="button" class="icon-btn danger-hover" data-action="delete-entry" title="删除条目" aria-label="删除条目">
          <svg class="icon" aria-hidden="true"><use href="#i-trash"></use></svg>
        </button>
      </div>
    </article>
  </template>
