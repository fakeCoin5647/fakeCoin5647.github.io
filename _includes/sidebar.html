    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="故事簿首页">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path d="M32 10c1.7 11.3 4.7 15.2 16 17-11.3 1.8-14.3 5.7-16 17-1.7-11.3-4.7-15.2-16-17 11.3-1.8 14.3-5.7 16-17Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="name">故事簿</span>
          <span class="tagline">STORY NOTES</span>
        </span>
      </a>

      <nav class="side-nav" aria-label="站点导航">
        <a class="nav-item" href="#/" id="sidebarShelfLink">
          <span class="nav-emoji" aria-hidden="true">🏠</span>
          <span>我的书架</span>
        </a>

        <a class="nav-item" href="#/trash" id="sidebarTrashLink">
          <svg class="icon nav-svg" aria-hidden="true"><use href="#i-trash"></use></svg>
          <span>回收站</span>
          <span class="nav-count" id="sidebarTrashCount" hidden>0</span>
        </a>

        <div class="nav-group">
          <p class="nav-label"><span aria-hidden="true">📚</span> 我的小说</p>
          <div class="subnav side-novel-list" id="sidebarNovelList"></div>
          <p class="side-empty" id="sidebarNovelsEmpty">书架还空着</p>
        </div>

        <div class="nav-group" id="sidebarSectionsGroup" hidden>
          <a class="side-book" id="sidebarBookLink" href="#/">
            <span class="side-book-emoji" aria-hidden="true">📖</span>
            <span class="side-book-name" id="sidebarBookName"></span>
          </a>
          <div class="subnav side-sections" id="workspaceNav" aria-label="小说内容导航"></div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="side-actions">
          <button type="button" class="side-action" id="importBtn" aria-label="导入备份">
            <svg class="icon" aria-hidden="true"><use href="#i-import"></use></svg>
            <span>导入</span>
          </button>
          <button type="button" class="side-action" id="exportBtn" aria-label="导出备份">
            <svg class="icon" aria-hidden="true"><use href="#i-export"></use></svg>
            <span>导出</span>
          </button>
          <button type="button" class="side-action" id="appearanceBtn" aria-expanded="false" aria-controls="appearancePanel" aria-label="调整界面透明度">
            <svg class="icon" aria-hidden="true"><use href="#i-sliders"></use></svg>
            <span>外观</span>
          </button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
        <p class="side-note"><span class="caption-dot" aria-hidden="true"></span>内容只保存在本机</p>

        <section class="appearance-panel" id="appearancePanel" aria-label="外观设置" hidden>
          <div class="appearance-head">
            <p class="appearance-title">外观</p>
            <button type="button" class="icon-btn appearance-close" id="appearanceCloseBtn" aria-label="关闭外观设置">
              <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
          </div>
          <label class="appearance-field" for="glassAlphaInput">
            <span class="appearance-label">面板不透明度 <output id="glassAlphaValue" for="glassAlphaInput">78%</output></span>
            <input type="range" id="glassAlphaInput" min="30" max="100" step="1" value="78">
          </label>
          <label class="appearance-field" for="cardAlphaInput">
            <span class="appearance-label">卡片不透明度 <output id="cardAlphaValue" for="cardAlphaInput">50%</output></span>
            <input type="range" id="cardAlphaInput" min="10" max="90" step="1" value="50">
          </label>
          <label class="appearance-field" for="blurInput">
            <span class="appearance-label">磨砂模糊 <output id="blurValue" for="blurInput">20px</output></span>
            <input type="range" id="blurInput" min="0" max="40" step="1" value="20">
          </label>
          <div class="appearance-foot">
            <button type="button" class="appearance-reset" id="appearanceResetBtn">恢复默认</button>
            <span class="appearance-saved">拖动即生效，自动保存</span>
          </div>
        </section>
      </div>
    </aside>
